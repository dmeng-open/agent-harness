[project]
name = "agent-harness"
version = "26.1.0"
description = "LLM pipelines and a tool-calling agent harness built on one chat-completion call"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "jsonschema>=4.20",
    "pytest>=8.0",
    "numpy>=2.0",
    "anthropic>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' -q"
markers = [
    "live: makes real LLM calls (run with `uv run pytest -m live`)",
]
